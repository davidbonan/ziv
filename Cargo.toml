[package]
name = "ziv"
version = "0.1.0"
edition = "2024"
description = "Lightweight Lightroom-like RAW photo editor"
authors = ["David Bonan"]
license = "MIT"
publish = false

[[bin]]
name = "ziv"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
bytemuck = "1"
# Already built for rawler; here for the local calendar day only (ADR 0011).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# No accesskit: on macOS the first AX query makes egui rebuild the full
# accessibility tree every frame for the life of the process.
dirs = "6"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "persistence",
    "wgpu",
] }
egui = "0.36"
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"] }
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "tiff",
] }
# Exact: a release candidate, upgraded deliberately (ADR 0006).
ort = { version = "=2.0.0-rc.13", features = ["coreml"] }
rawler = "0.8"
rayon = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
trash = { version = "5", default-features = false }
ureq = "3"
# Same version and backend as eframe's: the engine shares its device.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "metal",
] }

[features]
# Whole-app capture (Harness::new_eframe + wgpu PNG); enabled only by the headless-verify skill.
headless-verify = ["egui_kittest/eframe", "egui_kittest/wgpu"]

[dev-dependencies]
egui_kittest = "0.36"
pollster = "1"
tempfile = "3"

[[test]]
name = "it"
path = "tests/it/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

# Image math and egui are unusable unoptimised; ziv's own code stays debuggable.
[profile.dev.package."*"]
opt-level = 3
